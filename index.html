<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Gleba</title>
<style>
:root{--ink:#14201a;--mut:#5d6b62;--ln:#dde2dc;--bg:#f5f6f3;--pn:#fff;--g:#17392a;--ac:#1f7a52;--ac2:#e8f3ec;--dn:#b3382c}
@media(prefers-color-scheme:dark){:root{--ink:#e9efe9;--mut:#93a39a;--ln:#2c3a32;--bg:#101712;--pn:#16201a;--g:#0c1a12;--ac:#4fc08a;--ac2:#1d3326;--dn:#ef7b6e}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
#app{display:grid;grid-template-columns:380px 1fr;height:100%}
#side{display:flex;flex-direction:column;background:var(--pn);border-right:1px solid var(--ln);min-height:0;z-index:2}
header{background:var(--g);color:#fff;padding:14px 16px}header b{font-size:16px}header span{display:block;font-size:12px;opacity:.7}
.tabs{display:flex;border-bottom:1px solid var(--ln)}
.tabs button{flex:1;border:0;background:none;padding:12px 4px;color:var(--mut);font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
.body{flex:1;overflow:auto;padding:14px 16px}
.sec{display:none}.sec.on{display:block}
h3{font-size:12px;color:var(--mut);margin:18px 0 8px;font-weight:600}h3:first-child{margin-top:0}
button,select,input{font:inherit;color:var(--ink)}
.btn{border:1px solid var(--ln);background:var(--pn);padding:10px 12px;border-radius:8px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.big{padding:14px;font-size:15px;width:100%}
.btn.dn{color:var(--dn)}.btn.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}.btn.s{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--pn)}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}
.li .t{flex:1;min-width:0}.li small{display:block;color:var(--mut)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--ln);border-radius:99px;padding:6px 11px;cursor:pointer;display:flex;gap:6px;align-items:center}.chip.off{opacity:.4}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi{border:1px solid var(--ln);border-radius:10px;padding:12px}.kpi b{font-size:22px;display:block}.kpi small{color:var(--mut)}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.cov{margin:8px 0}.cov .h{display:flex;justify-content:space-between;margin-bottom:3px}
.empty{color:var(--mut);padding:14px;border:1px dashed var(--ln);border-radius:10px;text-align:center}
#mapw{position:relative;min-height:0;overflow:hidden;background:#1b2a21}
#map{position:absolute;left:0;top:0;touch-action:none;cursor:grab}
.fab{position:absolute;right:10px;top:10px;z-index:5;display:flex;flex-direction:column;gap:8px}
.fab button{width:44px;height:44px;border-radius:10px;border:0;background:var(--pn);box-shadow:0 1px 5px #0006;font-size:20px;font-weight:700}
#bm{position:absolute;left:10px;top:10px;z-index:5;display:flex;background:var(--pn);border-radius:10px;box-shadow:0 1px 5px #0006;overflow:hidden}
#bm button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--mut)}#bm button.on{background:var(--ac);color:#fff}
#hud{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:none;background:var(--g);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 4px 14px #0006}
#hud.on{display:block}#hud .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
#hud b{font-size:20px;display:block}#hud small{opacity:.7;font-size:11px}
#hud .rec{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
#hud button{background:#ff5a4d;border:0;color:#fff;border-radius:8px;padding:8px 14px;font-weight:700}
dialog{border:0;border-radius:14px;padding:18px;width:min(92vw,380px);background:var(--pn);color:var(--ink)}
dialog::backdrop{background:#0008}dialog h2{margin:0 0 12px;font-size:17px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 16px;border-radius:10px;z-index:9999;display:none;max-width:90vw}
.li{flex-wrap:wrap}.acts{display:flex;gap:6px;flex-wrap:wrap;width:100%}dialog{max-height:92vh;overflow:auto}textarea{width:100%;min-height:110px;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--pn);font:inherit;color:var(--ink)}
#dbar{position:absolute;left:10px;right:64px;bottom:10px;z-index:6;display:none;gap:8px;flex-wrap:wrap}
#dbar.on{display:flex}#dbar .btn{flex:1;min-width:90px;padding:13px 8px;box-shadow:0 2px 8px #0007}
#pinfo{display:none}
@media print{body.printing{background:#fff;color:#000;height:auto}body.printing #side,body.printing .fab,body.printing #bm,body.printing #dbar,body.printing #hud,body.printing #toast{display:none!important}
body.printing #app{display:block;height:auto}body.printing #pinfo{display:block;font-size:12px;margin-bottom:8px}
body.printing #mapw{width:100%;height:auto;aspect-ratio:var(--ar);max-height:230mm}body.printing #map{position:static;width:100%!important;height:100%!important}}
@media(max-width:800px){body.full #app{grid-template-rows:1fr 0}body.full #side{display:none}#app{grid-template-columns:1fr;grid-template-rows:1fr 46%}#side{order:2;border-right:0;border-top:1px solid var(--ln)}header{display:none}#hud .g{grid-template-columns:repeat(2,1fr)}}
#q{margin-bottom:6px}#qr .li{padding:6px 0}#sbar{position:absolute;left:10px;right:64px;bottom:10px;z-index:6;display:none;gap:8px;flex-wrap:wrap;align-items:center;background:var(--pn);border-radius:12px;padding:8px;box-shadow:0 2px 8px #0007}#sbar.on{display:flex}#sbar b{flex:1;min-width:110px}.fab button.on{background:var(--ac);color:#fff}input[type=range]{padding:0}#kbH{margin-top:14px;color:var(--mut)}#kbH div{margin:4px 0}
</style></head><body>
<div id="app">
<aside id="side">

<div class="body">

<h3>Camadas</h3><div id="lCam"></div><div class="row"><button class="btn" id="bLay">Nova camada</button></div><h3>Filtros</h3><div id="lLay"></div><h3>Piquetes</h3><div id="lP"></div><h3>Estruturas</h3><div id="lE"></div><h3>Marcadores</h3><div id="lPt"></div><h3>Tubulação e fiação</h3><div id="lL"></div>
<h3>Mapas offline</h3>
<div class="row"><div><label>Máximo de detalhe do satélite (se a imagem ficar cinza ou borrada, diminua)</label><select id="nz"><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option></select></div></div>
<div class="row"><div><label>Detalhe máximo</label><select id="oz"><option value="17">Médio (zoom 17)</option><option value="18" selected>Alto (zoom 18)</option><option value="19">Máximo (zoom 19)</option><option value="20">Extremo (zoom 20, provedor próprio)</option></select></div></div>
<button class="btn pri big" id="bOff">Baixar a área visível na tela</button>
<div class="bar" id="offp" style="display:none;margin-top:8px"><i id="offb" style="width:0;background:var(--ac)"></i></div>
<div id="offt" style="color:var(--mut);margin:4px 0"></div><button class="btn dn" id="bOffX" style="display:none;width:100%">Cancelar download</button>
<div id="lOff"></div>
<h3>Dados</h3>
<div class="row"><button class="btn" id="bImp">Importar</button><button class="btn" id="bExpG">GeoJSON</button><button class="btn" id="bBk">Backup</button></div>
<input type="file" id="fImp" accept=".json,.geojson" hidden>
</div>
<div class="sec" id="s-trk">
<h3>Nova operação</h3>
<div class="row"><div><label>Serviço</label><select id="opType"><option value="arar">Aração</option><option value="gradear">Gradagem</option><option value="rocar">Roçada</option><option value="pulverizar">Pulverização</option><option value="adubar">Adubação</option></select></div>
<div><label>Largura útil (m)</label><input id="wid" type="number" step="0.1" min="0.5" value="3"></div></div>
<div class="row"><div><label>Implemento</label><input id="impl"></div><div><label>Operador</label><input id="oper"></div></div>
<button class="btn pri big" id="bStart">Iniciar com GPS</button>
<div class="row" style="margin-top:8px"><button class="btn" id="bManual">Traçar por toques no mapa</button></div>
<div class="row"><button class="btn" id="bLanc">Lançar serviço em piquete (sem GPS)</button></div>
<h3>Programação</h3><div class="row"><button class="btn" id="bPlan">Programar atividade</button></div><div id="lPlan"></div><h3>Histórico</h3><div class="chips" id="chips"></div><div id="lO"></div>
<div class="row" style="margin-top:10px"><button class="btn" id="bCsv">Exportar CSV</button></div>
</div>
<div class="sec" id="s-dash"><div id="dash"></div></div>
<div class="sec" id="s-gas"><button class="btn pri big" id="bGas">Lançar gasto</button><h3>Resumo</h3><div id="gSum"></div><h3>Lançamentos</h3><div id="lG"></div><div class="row" style="margin-top:10px"><button class="btn" id="bGcsv">Exportar CSV</button></div></div>
</div></aside>
<div id="pinfo"></div><div id="mapw"><canvas id="map"></canvas>
<div id="bm"><button data-b="sat" class="on">Satélite</button><button data-b="hyb">Híbrido</button><button data-b="osm">Mapa</button></div>
<div class="fab"><button id="bZi">+</button><button id="bZo">−</button><button id="bLoc">◎</button><button id="bFit">⤢</button><button id="bExp" title="Tela cheia">▤</button></div>
<div id="dbar"><button class="btn pri" id="fClose">✓ Fechar piquete</button><button class="btn" id="fGps">📍 Aqui</button><button class="btn" id="fMove">✥ Mover</button><button class="btn" id="fKey">Livre</button><button class="btn" id="fUndo">Desfazer</button><button class="btn dn" id="fCancel">Cancelar</button></div>
<div id="hud"><div class="rec"><span id="hTipo">Gravando</span><button id="bStop">Finalizar</button></div>
<div class="g"><div><b id="hArea">0,00</b><small>hectares</small></div><div><b id="hSpd">0</b><small>km/h</small></div><div><b id="hRate">0,0</b><small>ha/h</small></div><div><b id="hTime">00:00</b><small id="hAcc">tempo</small></div></div></div>
</div></div>
<dialog id="dlg"><form method="dialog" id="dform"></form></dialog><div id="toast"></div>

<script>
(async()=>{
const $=id=>document.getElementById(id),K='mapa_fazenda_v3';
const COR={arar:'#e8892b',gradear:'#e5c317',rocar:'#43c463',pulverizar:'#3b9bff',adubar:'#c06cff'};
const NOME={arar:'Aração',gradear:'Gradagem',rocar:'Roçada',pulverizar:'Pulverização',adubar:'Adubação'};
const PT={camera:['#7c5cff','📷','Câmera'],interruptor:['#f2a900','💡','Interruptor'],bebedouro:['#1e90ff','💧','Bebedouro'],aspersor:['#00a6a6','🌀','Aspersor'],bomba:['#c0392b','⚙️','Bomba / registro'],porteira:['#8d6e63','🚪','Porteira'],cocho:['#a1887f','🥣','Cocho'],outro:['#607d8b','📍','Outro']};
const GD=()=>new Promise((ok,no)=>{const r=indexedDB.open('gleba_data',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('st');d.createObjectStore('img')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const gop=(st,m,fn)=>GD().then(d=>new Promise((ok,no)=>{const t=d.transaction(st,m),r=fn(t.objectStore(st));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)}));
const HG=new Set();let MIG=0;
let WL=null,HV=null,TM=0;const KS={x:0,y:0};let S=await gop('st','readonly',s=>s.get('S')).catch(()=>null);
if(!S){try{S=JSON.parse(localStorage.getItem(K));if(S)MIG=1}catch(e){}}
S=S||{};S.paddocks=S.paddocks||[];S.points=S.points||[];S.ops=S.ops||[];S.plan=S.plan||[];S.lines=S.lines||[];S.layers=S.layers&&S.layers.length?S.layers:[{id:'l0',name:'Fazenda',vis:1}];S.gastos=S.gastos||[];S.filt=S.filt||{};S.lay=S.lay||{};S.fm=S.fm||{};
let svT=0;const flush=()=>{clearTimeout(svT);svT=0;let c;try{c=structuredClone(S)}catch(e){c=JSON.parse(JSON.stringify(S))}
 gop('st','readwrite',s=>s.put(c,'S')).then(()=>{if(MIG){try{localStorage.removeItem(K)}catch(e){}MIG=0}}).catch(()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Sem espaço no navegador. Exporte um backup.')}})};
const save=()=>{clearTimeout(svT);svT=setTimeout(flush,200)};
addEventListener('pagehide',()=>{if(svT)flush()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&svT)flush()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const fmt=(n,d=2)=>n.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const ha=m=>fmt(m/1e4)+' ha';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
/* ===== motor do mapa (sem bibliotecas) ===== */
const cv=$('map'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,V={lng:-50,lat:-15,z:4},bm='sat',mode=null,draft=[],edit=null,T=null,wid=null,me=null,pend=false;
const SAT='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
const TL={sat:[SAT],hyb:[SAT,'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],osm:['https://tile.openstreetmap.org/{z}/{x}/{y}.png']};
const cache=new Map();let NZ=S.nz||17;
let _db;const db=()=>_db||(_db=new Promise((ok,no)=>{const r=indexedDB.open('fazenda_tiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('t');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
const idb=(m,fn)=>db().then(d=>new Promise((ok,no)=>{const t=d.transaction('t',m),r=fn(t.objectStore('t'));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)}));
const getTile=u=>idb('readonly',s=>s.get(u)).catch(()=>null);
function tile(u){let i=cache.get(u);if(!i){i=new Image();i.onload=()=>{i.ok=1;draw()};i.onerror=()=>{if(cache.get(u)===i)cache.delete(u)};cache.set(u,i);
 getTile(u).then(b=>{i.src=b?URL.createObjectURL(b):u});
 if(cache.size>700){const k=cache.keys().next().value,o=cache.get(k);if(o.src.startsWith('blob:'))URL.revokeObjectURL(o.src);cache.delete(k)}}return i}
const wp=(lng,lat,z=V.z)=>{const s=256*2**z,n=Math.sin(lat*Math.PI/180);return[(lng+180)/360*s,(.5-Math.log((1+n)/(1-n))/(4*Math.PI))*s]};
const unp=(x,y,z=V.z)=>{const s=256*2**z;return[x/s*360-180,Math.atan(Math.sinh(Math.PI*(1-2*y/s)))*180/Math.PI]};
const sp=(lng,lat)=>{const a=wp(lng,lat),c=wp(V.lng,V.lat);return[a[0]-c[0]+W/2,a[1]-c[1]+H/2]};
const ll=(x,y)=>{const c=wp(V.lng,V.lat);return unp(x-W/2+c[0],y-H/2+c[1])};
const mpp=()=>156543.03392*Math.cos(V.lat*Math.PI/180)/2**V.z;
function resize(){const r=$('mapw').getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';draw()}
function draw(){if(!pend){pend=true;requestAnimationFrame(paint)}}
function path(pts,close){ctx.beginPath();pts.forEach((p,i)=>{const s=sp(p[0],p[1]);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});if(close)ctx.closePath()}
function paint(){pend=false;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#1b2a21';ctx.fillRect(0,0,W,H);
 const zi=Math.min(NZ,Math.max(1,Math.round(V.z))),k=2**(V.z-zi),c=wp(V.lng,V.lat,zi),n=2**zi;
 TL[bm].forEach(t=>{for(let ty=Math.floor((c[1]-H/2/k)/256);ty<=Math.floor((c[1]+H/2/k)/256);ty++){if(ty<0||ty>=n)continue;
  for(let tx=Math.floor((c[0]-W/2/k)/256);tx<=Math.floor((c[0]+W/2/k)/256);tx++){const u=t.replace('{z}',zi).replace('{x}',((tx%n)+n)%n).replace('{y}',ty),im=tile(u);
   if(im.ok)ctx.drawImage(im,(tx*256-c[0])*k+W/2,(ty*256-c[1])*k+H/2,256*k+.6,256*k+.6)}}});
 drawOv();const m=mpp();ctx.lineCap='butt';ctx.lineJoin='round';
 S.ops.forEach(o=>{if(S.filt[o.type]===false||o.hide||S.lay.o===false)return;path(o.track);ctx.globalAlpha=.5;ctx.strokeStyle=COR[o.type];ctx.lineWidth=Math.max(2,o.width/m);ctx.stroke();ctx.globalAlpha=1});
 if(T&&T.pts.length){path(T.pts);ctx.globalAlpha=.55;ctx.strokeStyle=COR[T.type];ctx.lineWidth=Math.max(2,T.width/m);ctx.stroke();ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}
 ctx.font='600 13px system-ui';ctx.textAlign='center';
 sortL(S.paddocks).forEach(p=>{if(!vis(p)||!lOn(p)||(mode==='edit'&&edit.p===p))return;const c=p.c,col=p.color||'#ffffff';path(c,true);ctx.globalAlpha=.22;ctx.fillStyle=col;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=col;ctx.lineWidth=p.kind==='e'?2:3;ctx.stroke();
  const a=c.reduce((s,q)=>[s[0]+q[0]/c.length,s[1]+q[1]/c.length],[0,0]),s=sp(a[0],a[1]);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=4;
  let y=s[1];ctx.font='22px system-ui';ctx.fillText((FN[p.fn]||['','▫️'])[1],s[0],y);ctx.font='600 13px system-ui';
  if(!p.hName){y+=18;ctx.fillText(p.name,s[0],y)}if(!p.hArea){y+=16;ctx.fillText(ha(pArea(c)),s[0],y)}if(p.obs&&p.sObs){y+=16;ctx.fillText(p.obs,s[0],y)}

 const m=t.match(/^\s*(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)\s*$/);if(m){const la=num(m[1]),lo=num(m[2]);if(okLL([lo,la]))A('Ir para '+la+', '+lo,'Coordenadas',()=>{FIND=[lo,la];V.lng=lo;V.lat=la;V.z=Math.max(V.z,17);draw()})}
 S.groups.forEach(g=>{if(has(g.name))A(g.name,(g.lote?'Lote':'Grupo')+' · '+memb(g).length+' itens',()=>goSel(memb(g)))});
 S.paddocks.forEach(p=>{if(has(p.name)||has(p.obs)||has((FN[p.fn]||[])[0]))A(p.name,(p.kind==='e'?'Estrutura':'Piquete')+' · '+ha(pArea(p.c)),()=>goSel(['p:'+p.id]))});
 S.points.forEach(p=>{if(has(p.name)||has(p.obs)||has((PT[p.type]||[])[2]))A(p.name,(PT[p.type]||PT.outro)[2],()=>goSel(['m:'+p.id]))});
 S.lines.forEach(l=>{if(has(l.name)||has(l.obs))A(l.name,l.kind==='fio'?'Fiação':'Tubulação',()=>goSel(['l:'+l.id]))});
 S.zones.forEach(z=>{if(has(z.name)||has(z.note))A(z.name,'Área restrita',()=>goSel(['z:'+z.id]))});return R}
function qList(){$('qr').innerHTML=SRC.slice(0,12).map((r,i)=>`<div class="li"><div class="t"><b>${esc(r.l)}</b><small>${esc(r.s)}</small></div><button class="btn s" data-qi="${i}">Ir</button></div>`).join('')}
$('q').oninput=()=>{const t=$('q').value.trim();SRC=t?search(t):[];qList();if(t)$('qr').insertAdjacentHTML('beforeend','<button class="btn s" data-qw="1" style="margin:6px 0">Buscar “'+esc(t)+'” na internet (endereço/lugar)</button>')};
$('q').onkeydown=e=>{if(e.key==='Enter'&&SRC[0])SRC[0].f();if(e.key==='Escape'){$('q').value='';SRC=[];qList();$('q').blur()}};
async function webQ(t){if(!t)return;try{toast('Buscando...');const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&q='+encodeURIComponent(t))).json();if(!r.length)return toast('Nada encontrado.');
 SRC=r.map(x=>({l:x.display_name.split(',').slice(0,2).join(','),s:x.display_name,f:()=>{FIND=[+x.lon,+x.lat];V.lng=FIND[0];V.lat=FIND[1];V.z=Math.max(V.z,16);draw()}}));qList()}catch(e){toast('Sem internet ou busca indisponível.')}}

/* --- desenho por cima: areas restritas, medidas, selecao --- */
function hatch(){if(!HP){const c=document.createElement('canvas');c.width=c.height=14;const x=c.getContext('2d');x.fillStyle='rgba(255,59,48,.18)';x.fillRect(0,0,14,14);x.strokeStyle='rgba(255,59,48,.85)';x.lineWidth=2;x.beginPath();x.moveTo(0,14);x.lineTo(14,0);x.stroke();HP=ctx.createPattern(c,'repeat')}return HP}
function dims(c,close){const n=c.length,e=close?n:n-1;for(let i=0;i<e;i++){const a=c[i],b=c[(i+1)%n],s=sp(a[0],a[1]),t=sp(b[0],b[1]);if(Math.hypot(s[0]-t[0],s[1]-t[1])<46)continue;ctx.fillText(fmt(dist(a,b),1)+' m',(s[0]+t[0])/2,(s[1]+t[1])/2-5)}}
function pill(t){ctx.shadowBlur=0;ctx.font='600 13px system-ui';const w=ctx.measureText(t).width+20;ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(W/2-w/2,10,w,26);ctx.fillStyle='#fff';ctx.fillText(t,W/2,28)}
function drawTop(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.textAlign='center';ctx.font='600 12px system-ui';
 S.zones.forEach(z=>{if(!lOn(z)||S.lay.z===false||(mode==='edit'&&edit.p===z))return;path(z.c,true);ctx.fillStyle=hatch();ctx.fill();ctx.strokeStyle='#ff3b30';ctx.setLineDash([10,6]);ctx.lineWidth=2.5;ctx.stroke();ctx.setLineDash([]);
  const a=z.c.reduce((s,q)=>[s[0]+q[0]/z.c.length,s[1]+q[1]/z.c.length],[0,0]),s=sp(a[0],a[1]);ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.fillText('🚫 '+z.name,s[0],s[1]);ctx.fillText('sem: '+(z.blk||[]).map(k=>NOME[k]).join(', '),s[0],s[1]+15);ctx.shadowBlur=0});
 ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=4;
 if(S.dim){S.paddocks.forEach(p=>{if(vis(p)&&lOn(p)&&!p.sDim&&!(mode==='edit'&&edit.p===p))dims(p.c,1)});S.zones.forEach(z=>{if(lOn(z)&&S.lay.z!==false)dims(z.c,1)});S.lines.forEach(l=>{if(lOn(l)&&S.lay.l!==false)dims(l.c,0)})}
 const dr=mode==='edit'?edit.c:mode==='poly'?draft:null;
 if(dr&&dr.length){const poly=mode==='edit'||(drawKind!=='l'&&drawKind!=='a'&&dr.length>2);dims(dr,mode==='edit');
  if(mode==='poly'&&HV){const a=dr[dr.length-1],s=sp(a[0],a[1]),t=sp(HV[0],HV[1]);ctx.fillText(fmt(dist(a,HV),1)+' m',(s[0]+t[0])/2,(s[1]+t[1])/2-6)}
  if(dr.length>1){let L=0;for(let i=1;i<dr.length;i++)L+=dist(dr[i-1],dr[i]);if(poly)L+=dist(dr[dr.length-1],dr[0]);pill(poly?'Perímetro '+fmt(L,1)+' m · Área '+ha(pArea(dr)):'Comprimento '+fmt(L,1)+' m')}}
 ctx.shadowBlur=0;ctx.setLineDash([]);ctx.strokeStyle='#ffd400';ctx.lineWidth=4;
 selItems().forEach(({k,o})=>{if(k==='m'){const s=sp(o.lng,o.lat);ctx.beginPath();ctx.arc(s[0],s[1],21,0,7);ctx.stroke()}else{path(o.c,k!=='l');ctx.stroke()}});
 if(FIND){const s=sp(FIND[0],FIND[1]);ctx.beginPath();ctx.arc(s[0],s[1],9,0,7);ctx.fillStyle='#ff3b30';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke()}
 if(box&&box.mv){const x=Math.min(box.x0,box.x1),y=Math.min(box.y0,box.y1),w=Math.abs(box.x1-box.x0),h=Math.abs(box.y1-box.y0),cr=box.x1<box.x0;ctx.fillStyle=cr?'rgba(80,200,120,.18)':'rgba(60,140,255,.18)';ctx.strokeStyle=cr?'#4cc38a':'#3c8cff';ctx.lineWidth=1.5;ctx.setLineDash(cr?[6,4]:[]);ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);ctx.setLineDash([])}}
$('bDim').onclick=()=>{S.dim=!S.dim;save();$('bDim').classList.toggle('on',!!S.dim);draw()};

/* --- listas, grupos, camadas --- */
const _r4=render;render=function(){_r4();myRender()};
function myRender(){S.groups=S.groups||[];S.zones=S.zones||[];S.ov=S.ov||[];
 S.points.forEach(p=>{if(p.type==='aspersor'&&p.grp&&!p.gid)p.gid=p.grp});
 const used=new Set([...S.paddocks,...S.points,...S.lines,...S.zones].map(o=>o.gid).filter(Boolean));
 used.forEach(id=>{if(!S.groups.some(g=>g.id===id)){const f=S.points.find(p=>p.gid===id),a=f&&f.type==='aspersor';S.groups.push({id,name:a?'Lote '+String(f.name).replace(/\s*\d+$/,''):'Grupo',lote:a?1:0,vis:1})}});
 S.groups=S.groups.filter(g=>used.has(g.id));HG.clear();S.groups.forEach(g=>{if(g.vis===0)HG.add(g.id)});
 $('lGrp').innerHTML=S.groups.map(g=>`<div class="li"><span style="font-size:20px">${g.lote?'🌀':'🗂️'}</span><div class="t"><b>${esc(g.name)}</b><small>${memb(g).length} itens${g.lote?' · lote de aspersores':''}</small></div><div class="acts"><button class="btn s" data-gs="${g.id}">Selecionar</button><button class="btn s" data-gh="${g.id}">${g.vis===0?'Mostrar':'Ocultar'}</button><button class="btn s" data-gr="${g.id}">Nome</button><button class="btn s dn" data-gx="${g.id}">Excluir</button></div></div>`).join('')||'<div class="empty">Nenhum grupo. Selecione itens (⬚ ou Ctrl+clique) e toque em “Agrupar seleção”. Linhas de aspersores viram lotes sozinhas.</div>';
 $('lZ').innerHTML=S.zones.map(z=>`<div class="li"><span style="font-size:20px">🚫</span><div class="t"><b>${esc(z.name)}</b><small>${ha(pArea(z.c))} · sem ${(z.blk||[]).map(k=>NOME[k]).join(', ')||'—'}${z.note?' · '+esc(z.note):''}</small></div><div class="acts"><button class="btn s" data-zv="${z.id}">Ver</button><button class="btn s" data-ze="${z.id}">Editar</button><button class="btn s" data-zf="${z.id}">Forma</button><button class="btn s dn" data-zx="${z.id}">Excluir</button></div></div>`).join('')||'<div class="empty">Nenhuma área restrita. Use “Área restrita” (tecla R).</div>';
 $('lOv').innerHTML=S.ov.map(o=>`<div class="li"><div class="t"><b>${esc(o.name)}</b><small>Foto de drone · opacidade</small><input type="range" min="10" max="100" value="${Math.round((o.op??.85)*100)}" data-ovo="${o.id}"></div><div class="acts"><button class="btn s" data-ovv="${o.id}">Ver</button><button class="btn s" data-ovh="${o.id}">${o.vis===0?'Mostrar':'Ocultar'}</button><button class="btn s" data-ovp="${o.id}">Posição</button><button class="btn s dn" data-ovx="${o.id}">X</button></div></div>`).join('');
 document.querySelectorAll('[data-lx]').forEach(b=>b.insertAdjacentHTML('afterend','<button class="btn s dn" data-lxe="'+b.dataset.lx+'">Excluir c/ itens</button>'));
 const c=document.querySelector('#lLay .chips');if(c&&!c.querySelector('[data-lay="z"]'))c.insertAdjacentHTML('beforeend','<div class="chip '+(S.lay.z===false?'off':'')+'" data-lay="z">Áreas restritas</div>');
 $('bDim').classList.toggle('on',!!S.dim);selUI()}
document.body.addEventListener('click',async e=>{const d=e.target.closest('[data-gs],[data-gh],[data-gr],[data-gx],[data-lxe],[data-ovv],[data-ovh],[data-ovp],[data-ovx],[data-zv],[data-ze],[data-zf],[data-zx],[data-qi],[data-qw]');if(!d)return;const x=d.dataset;
 if(x.qi!=null){SRC[+x.qi].f();return}if(x.qw!=null){webQ($('q').value.trim());return}
 const g=S.groups.find(g=>g.id===(x.gs||x.gh||x.gr||x.gx)),o=S.ov.find(o=>o.id===(x.ovv||x.ovh||x.ovp||x.ovx)),z=S.zones.find(z=>z.id===(x.zv||x.ze||x.zf||x.zx));
 if(x.gs){goSel(memb(g));return}
 if(x.gh)g.vis=g.vis===0?1:0;
 if(x.gr){const r=await ask('Nome do grupo',[{k:'n',l:'Nome',v:g.name}]);if(r&&r.n.trim())g.name=r.n.trim()}
 if(x.gx){const r=await ask('Excluir “'+g.name+'”',[{k:'m',l:'O que fazer',s:[['g','Só desfazer o grupo (manter os itens)'],['t','Excluir o grupo E todos os itens dele']],v:'g'}]);if(!r)return;snapS();const ids=memb(g);if(r.m==='t')delIds(ids);else ids.forEach(s=>delete getEl(s).gid);S.groups=S.groups.filter(q=>q!==g)}
 if(x.lxe){const l=S.layers.find(l=>l.id===x.lxe);if(!l||!confirm('Excluir a camada “'+l.name+'” E todos os itens dela?'))return;snapS();delIds([['p',S.paddocks],['m',S.points],['l',S.lines],['z',S.zones]].flatMap(([k,a])=>a.filter(i=>(i.layer||'l0')===x.lxe).map(i=>k+':'+i.id)));S.layers=S.layers.filter(q=>q!==l);if(S.al===x.lxe)S.al='l0'}
 if(x.ovv){fitPts([[o.b.w,o.b.n],[o.b.e,o.b.s]]);return}
 if(x.ovh)o.vis=o.vis===0?1:0;
 if(x.ovp){if(!(await ovDlg(o,0)))return}
 if(x.ovx){if(!confirm('Remover esta foto de drone?'))return;gop('img','readwrite',s=>s.delete(o.id)).catch(()=>0);delete OVI[o.id];S.ov=S.ov.filter(q=>q!==o)}
 if(x.zv){fitPts(z.c);return}
 if(x.ze){const r=await zoneDlg(z);if(r)Object.assign(z,r);else return}
 if(x.zf){cancelDraw();mode='edit';edit={p:z,c:z.c.map(q=>q.slice()),u:[],mv:0,sel:null};fitPts(z.c);drawBar();toast('Arraste os cantos e toque em Salvar.');return}
 if(x.zx){if(!confirm('Excluir esta área restrita?'))return;snapS();S.zones=S.zones.filter(q=>q!==z)}
 save();render()});

/* --- atalhos de teclado --- */
addEventListener('keydown',e=>{const t=document.activeElement&&document.activeElement.tagName;if(/INPUT|TEXTAREA|SELECT/.test(t)||$('dlg').open)return;const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey,dw=mode==='poly'||mode==='edit'||mode==='mvpt';
 if(k==='enter'){if(dw&&!$('bDone').disabled){e.preventDefault();$('bDone').click()}return}
 if(c){const f={a:selAll,z:()=>dw?$('bUndo').click():undoDel(),g:grpSel,f:()=>$('q').focus(),s:()=>$('bBk').click()}[k];if(f){e.preventDefault();f()}return}
 if(k==='delete'||k==='backspace'){e.preventDefault();if(dw&&mode==='poly')$('bUndo').click();else if(SEL.size)delSel();return}
 if(k==='escape'){SEL.clear();if(selMode)toggleSel();selUI();return}
 if(k==='/'){e.preventDefault();$('q').focus();return}
 if(k==='?'){const d=$('kbH');d.open=true;d.scrollIntoView({block:'center'});return}
 if(k==='+'||k==='='){zoomAt(W/2,H/2,V.z+1);return}if(k==='-'){zoomAt(W/2,H/2,V.z-1);return}
 if(k==='f'){$('bFit').click();return}if(k==='d'){$('bDim').click();return}if(k==='s'){toggleSel();return}
 const m={p:'bPoly',e:'bStr',m:'bPt',l:'bLine',a:'bAsp',r:'bZone',g:'bWalk'}[k];if(m&&!dw&&!T){e.preventDefault();$(m).click()}});
ovLoad();if(MIG)flush();

addEventListener('resize',resize);resize();render();fit();
})();
